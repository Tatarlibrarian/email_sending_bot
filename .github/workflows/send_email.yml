name: Scheduled Email Sender

on:
  # 方式1: 定时触发 (Schedule)
  # 语法: cron: '分 时 日 月 星期' (使用 UTC 时间)
  # 美东时间 1月13日 09:30 AM = UTC 时间 1月13日 14:30
  schedule:
    - cron: '30 14 13 1 *'
  
  # 方式2: 保留手动触发按钮 (方便测试或补发)
  workflow_dispatch:

jobs:
  send-emails:
    runs-on: ubuntu-latest
    # 设置最大运行时间为 360 分钟 (6小时)，防止被意外切断
    timeout-minutes: 360 

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Run Python script
        env:
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
          MY_PASSWORD: ${{ secrets.MY_PASSWORD }}
        run: |
          python send_mail.py
