name: Send Email Invitations

# 触发方式：手动触发 (Workflow Dispatch)
# 这样你可以点击按钮才发送，防止提交代码时误发
on:
  workflow_dispatch:

jobs:
  send-emails:
    runs-on: ubuntu-latest

    steps:
      # 1. 下载仓库代码
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # 3. 运行发送脚本
      - name: Run Python script
        env:
          # 将 GitHub Secrets 注入到环境变量中
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
          MY_PASSWORD: ${{ secrets.MY_PASSWORD }}
        run: |
          python send_mail.py
